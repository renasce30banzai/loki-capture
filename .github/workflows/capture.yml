name: loki-capture

on:
  # MODO NUVEM UNICO: o Mac roda por IP direto; aqui o egress e o proxy residencial BR.
  # Ao rodar os dois juntos, mensagens duplicam (dedupe local e state.bin sao listas
  # separadas) — por isso o launchd do Mac fica descarregado.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loki
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Capture
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          PROXY: ${{ secrets.PROXY }}
          RUN_SECONDS: "230"
          LOOKBACK_MIN: "15"
          INTERVAL: "15"
        run: |
          pip install --quiet cryptography
          python3 -u capture.py

      - name: Persist state
        if: always()
        run: |
          git config user.name capture-bot
          git config user.email bot@users.noreply.github.com
          git add -A state.bin state.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "state $(date -u +%FT%TZ)"
          git pull --rebase --quiet || true
          git push --quiet || true
