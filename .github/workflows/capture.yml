name: loki-capture

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loki
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Capture
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_SECONDS: "230"
          LOOKBACK_MIN: "20"
        run: python3 -u capture.py

      - name: Persist state
        if: always()
        run: |
          git config user.name capture-bot
          git config user.email bot@users.noreply.github.com
          git add -A state.json || true
          git diff --staged --quiet || git commit -m "state $(date -u +%FT%TZ)"
          git pull --rebase --quiet || true
          git push --quiet || true
